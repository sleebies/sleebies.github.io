<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleepyz2002 · photos</title>
  <link rel="stylesheet" href="style.css">
  <script src="songs.js"></script>
  <script src="music.js"></script>
  <script src="photos.js"></script>
</head>
<body class="photos-page">
  <h1>photos</h1>
  <div class="scatter" id="scatter"></div>
  <div class="unplaced" id="unplaced"></div>
  <div class="lightbox" id="lightbox"><img alt=""></div>
  <div class="corner left"><a href="./">back</a></div>

  <script>
    // Where each photo sits, in % of the screen width: [left, top, width].
    // "wide" is computers, "phone" is narrow screens. Photos are the original
    // files, untouched; the browser only scales them to fit.
    // A photo with no spot here still shows up, just below the others.
    const LAYOUT = {
      'sonabrycethingfuckidk.png': { wide: [26.1, 4.7, 13.5], phone: [30, 4, 66] },
      'ufo-ocean.png':             { wide: [16.4, 9.3, 11.5], phone: [4, 42, 58] },
      'hicj.png':                  { wide: [57, 7, 11.95],    phone: [40, 92, 56] },
      'sapper-screen.png':         { wide: [36.5, 16, 12.4],  phone: [4, 164, 58] },
      'gmod-signal-logo.png':      { wide: [33.6, 27.4, 11.7], phone: [18, 218, 64] },
      'signal-intro-card.png':     { wide: [30.9, 32.3, 16.5], phone: [10, 241, 80] },
      'tat.png':                   { wide: [53, 27.3, 15.35], phone: [14, 309, 72] },
      'why.png':                   { wide: [3.5, 19.5, 12],   phone: [48, 418, 46] },
      'chloe.png':                 { wide: [71.5, 4.5, 10],   phone: [8, 412, 40] },
      'idiot-hq.jpg':              { wide: [72.5, 17, 9],     phone: [6, 470, 42] },
      'idiot.jpg':                 { wide: [82.5, 20.5, 9.5], phone: [46, 478, 48] },
      'zcity-thumbnail.png':       { wide: [9, 34, 18],       phone: [4, 550, 70] },
      'zcity-tdm-thumbnail.png':   { wide: [11.5, 46, 18],    phone: [24, 594, 72] },
    };

    const scatter = document.getElementById('scatter');
    const unplaced = document.getElementById('unplaced');
    const lb = document.getElementById('lightbox');
    const placed = [];
    PHOTOS.forEach(name => {
      const img = document.createElement('img');
      img.src = 'photos/' + encodeURIComponent(name);
      img.alt = '';
      img.onclick = () => { lb.firstElementChild.src = img.src; lb.classList.add('show'); };
      if (LAYOUT[name]) { img.dataset.name = name; placed.push(img); scatter.appendChild(img); }
      else unplaced.appendChild(img);
    });
    lb.onclick = () => lb.classList.remove('show');

    const narrow = matchMedia('(max-width: 700px)');
    function arrange() {
      const key = narrow.matches ? 'phone' : 'wide';
      let bottom = 0;
      placed.forEach(img => {
        const [x, y, w] = LAYOUT[img.dataset.name][key];
        img.style.left = x + 'vw';
        img.style.top = y + 'vw';
        img.style.width = w + 'vw';
        const ratio = img.naturalWidth ? img.naturalHeight / img.naturalWidth : 0.75;
        bottom = Math.max(bottom, y + w * ratio);
      });
      scatter.style.height = (bottom + 4) + 'vw';
    }
    narrow.addEventListener('change', arrange);
    placed.forEach(img => img.addEventListener('load', arrange));
    arrange();
  </script>
</body>
</html>
