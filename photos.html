<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleepyz2002 · photos</title>
  <link rel="stylesheet" href="style.css">
  <script src="songs.js"></script>
  <script src="music.js"></script>
  <script src="photos.js"></script>
</head>
<body class="corkboard-page">
  <h1>photos</h1>
  <!-- Photos: drop them in the photos folder. The list (photos.js) builds itself. -->
  <div class="corkboard" id="board"></div>
  <div class="lightbox" id="lightbox"><img alt=""></div>
  <div class="corner left"><a href="./">back</a></div>

  <script>
    const board = document.getElementById('board');
    const lb = document.getElementById('lightbox');
    // same file always lands at the same tilt, so the board doesn't reshuffle on every visit
    function hash(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return (h >>> 0) / 4294967296; }
    if (!PHOTOS.length) board.innerHTML = '<p class="empty-note">nothing pinned yet</p>';
    PHOTOS.forEach(name => {
      const r = hash(name), r2 = hash(name + '!');
      const pin = document.createElement('figure');
      pin.className = 'pinned';
      pin.style.setProperty('--tilt', ((r - 0.5) * 14).toFixed(1) + 'deg');
      pin.style.setProperty('--nudge', ((r2 - 0.5) * 30).toFixed(0) + 'px');
      pin.style.setProperty('--pin', (35 + r2 * 30).toFixed(0) + '%');
      const img = document.createElement('img');
      img.src = 'photos/' + encodeURIComponent(name);
      img.alt = '';
      img.loading = 'lazy';
      pin.appendChild(img);
      pin.onclick = () => { lb.firstElementChild.src = img.src; lb.classList.add('show'); };
      board.appendChild(pin);
    });
    lb.onclick = () => lb.classList.remove('show');
  </script>
</body>
</html>
