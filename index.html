<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleepyz2002</title>
  <link rel="stylesheet" href="style.css">
  <script src="songs.js"></script>
  <script src="music.js"></script>
  <script src="slideshow.js"></script>
  <script src="crimson-lines.js"></script>
</head>
<body>
  <h1>welcome to sleepyz2002dotcom</h1>
  <main class="stage">
    <div class="slideshow" id="slideshow"></div>
    <nav class="links">
      <a href="photos.html">photos</a>
      <a href="videos.html">videos</a>
      <a href="souls.html">souls</a>
    </nav>
  </main>
  <button class="logo" id="logo" aria-label="crimson logo">
    <svg viewBox="0 0 379 379" aria-hidden="true">
      <g class="spin" fill="none" stroke="#ff0000" stroke-width="15">
        <polygon points="206,24 50,291 362,291" style="transform-origin: 206px 202px"/>
        <polygon points="253,28 28,247 333,328" style="transform-origin: 204.7px 201px"/>
        <polygon points="288,44 16,200 288,356" style="transform-origin: 197.3px 200px"/>
      </g>
    </svg>
  </button>
  <div class="bubble" id="bubble" aria-live="polite"></div>
  <div class="corner left"><a href="socials.html">sleepyz</a></div>

  <script>
    // Pictures: just drop them in the slideshow folder (the list lives in slideshow.js).
    const SECONDS = 8;

    const box = document.getElementById('slideshow');
    const imgs = IMAGES.map(name => {
      const img = document.createElement('img');
      img.src = 'slideshow/' + name;
      img.alt = '';
      box.appendChild(img);
      return img;
    });
    // Shuffled deck: every picture shows once before any repeats, and a new
    // deck never starts with the picture that was just on screen.
    let deck = [];
    function draw(last) {
      if (!deck.length) {
        deck = imgs.map((_, i) => i);
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        if (deck.length > 1 && deck[deck.length - 1] === last) {
          [deck[0], deck[deck.length - 1]] = [deck[deck.length - 1], deck[0]];
        }
      }
      return deck.pop();
    }
    let current = draw(-1);
    imgs[current].classList.add('on');
    if (imgs.length > 1) {
      setInterval(() => {
        const next = draw(current);
        imgs[current].classList.remove('on');
        imgs[next].classList.add('on');
        current = next;
      }, SECONDS * 1000);
    }

    // Logo: whole thing spins slowly; a click spins each triangle a random
    // number of turns in a random direction, all landing back in place after ~1s.
    const triangles = document.querySelectorAll('#logo polygon');
    let spinning = false;
    document.getElementById('logo').addEventListener('click', () => {
      if (spinning) return;
      spinning = true;
      triangles.forEach(t => {
        const turns = (1 + Math.floor(Math.random() * 3)) * (Math.random() < 0.5 ? -1 : 1);
        t.animate(
          [{ transform: 'rotate(0deg)' }, { transform: `rotate(${turns * 360}deg)` }],
          { duration: 1000, easing: 'cubic-bezier(.2,.7,.3,1)' }
        );
      });
      setTimeout(() => { spinning = false; }, 1000);
      say();
    });

    // Crimson's voice lines live in crimson-lines.js (one line per row). Edit that file.
    const LINES = CRIMSON_LINES.split('\n').map(l => l.trim()).filter(Boolean);
    const bubble = document.getElementById('bubble');
    let lineDeck = [], lastLine = -1, hideTimer;
    function say() {
      if (!lineDeck.length) {
        lineDeck = LINES.map((_, i) => i).sort(() => Math.random() - 0.5);
        if (lineDeck.length > 1 && lineDeck[lineDeck.length - 1] === lastLine) lineDeck.unshift(lineDeck.pop());
      }
      lastLine = lineDeck.pop();
      bubble.textContent = LINES[lastLine];
      bubble.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => bubble.classList.remove('show'), 5000);
    }
    // unprompted: every 40-90 seconds
    (function idle() {
      setTimeout(() => { if (!document.hidden) say(); idle(); }, 40000 + Math.random() * 50000);
    })();
  </script>
</body>
</html>
