# Publishes the site (not the music folder: Neocities free can't host mp3s, the player streams them from GitHub Pages) to Neocities (sleepyz2002.neocities.org) on every push to main.
# Needs a repo secret named NEOCITIES_API_TOKEN (your Neocities API key).
name: Deploy to Neocities

on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: neocities
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect site files
        run: |
          # rebuild the slideshow list from whatever is in the slideshow folder
          python3 -c "import json,os; f=sorted(n for n in os.listdir('slideshow') if n.lower().endswith(('.png','.jpg','.jpeg','.gif','.webp'))); open('slideshow.js','w').write('// List of home page slideshow pictures. Built automatically from the slideshow folder, no need to edit by hand.\\nconst IMAGES = [\\n' + ''.join('  ' + json.dumps(n) + ',\\n' for n in f) + '];\\n')"
          mkdir _site
          cp *.html *.css *.js _site/
          cp -r slideshow souls images photos _site/
          rm -f _site/photos/.gitkeep

      - name: Upload to Neocities
        uses: bcomnes/deploy-to-neocities@v3
        with:
          api_key: ${{ secrets.NEOCITIES_API_TOKEN }}
          dist_dir: _site
          cleanup: true
