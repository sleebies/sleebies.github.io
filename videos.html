<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleepyz2002 · videos</title>
  <link rel="stylesheet" href="style.css">
  <script src="songs.js"></script>
  <script src="music.js"></script>
  <script src="videos.js"></script>
</head>
<body>
  <h1>videos</h1>
  <!-- Videos live in the GitHub repo's videos folder (Neocities free can't host them).
       Drop a file in there and the list (videos.js) builds itself. The title is the
       file name, with _ and - turned into spaces. -->
  <div class="vidlist" id="list"></div>
  <div class="corner left"><a href="./">back</a></div>

  <script>
    const VIDEO_BASE = 'https://sleebies.github.io/videos/';
    const title = f => f.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
    const list = document.getElementById('list');
    const canHover = matchMedia('(hover: hover)').matches;
    const tell = msg => { if (parent !== window) parent.postMessage(msg, '*'); };

    // hover audio goes through the same kind of low-pass filter the home music uses away from home
    let ctx = null, filter = null;
    function audioOut() {
      if (ctx) return filter;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 500;
      filter.Q.value = 0.7;
      filter.connect(ctx.destination);
      return filter;
    }

    if (!VIDEOS.length) list.innerHTML = '<p class="empty-note">coming soon</p>';
    VIDEOS.forEach(file => {
      const a = document.createElement('a');
      a.className = 'vid';
      a.href = 'watch.html?v=' + encodeURIComponent(file);
      const v = document.createElement('video');
      v.crossOrigin = 'anonymous';
      v.src = VIDEO_BASE + encodeURIComponent(file) + '#t=0.5';
      v.preload = 'metadata';
      v.muted = true;
      v.playsInline = true;
      v.loop = true;
      const t = document.createElement('span');
      t.textContent = title(file);
      a.append(v, t);
      list.appendChild(a);

      if (!canHover) return;
      let routed = false, timer = 0, gain = null;
      a.addEventListener('mouseenter', () => {
        tell({ sleepyz: 'duck', on: true });
        const out = audioOut();
        if (out && !routed) {
          try {
            gain = ctx.createGain();
            gain.gain.value = 0;
            ctx.createMediaElementSource(v).connect(gain).connect(out);
            routed = true;
          } catch (e) { /* no sound preview, still plays the picture */ }
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        if (gain) gain.gain.setTargetAtTime(1, ctx.currentTime, 0.5);   // video sound creeps in
        v.muted = !routed;
        v.currentTime = 0;
        v.play().catch(() => { v.muted = true; v.play().catch(() => {}); });
      });
      a.addEventListener('mouseleave', () => {
        tell({ sleepyz: 'duck', on: false });
        if (gain) gain.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
        clearTimeout(timer);
        timer = setTimeout(() => { v.pause(); v.currentTime = 0.5; }, 400);
      });
    });
  </script>
</body>
</html>
