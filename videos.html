<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sleepyz2002 · videos</title>
  <link rel="stylesheet" href="style.css">
  <script src="songs.js"></script>
  <script src="music.js"></script>
  <script src="videos.js"></script>
</head>
<body class="videos-page">
  <h1>videos</h1>
  <!-- Videos live in the GitHub repo's videos folder (Neocities free can't host them).
       Drop a file in there and the list (videos.js) builds itself, newest first.
       The title is the file name, with _ and - turned into spaces. -->
  <table class="vidlist" id="list"></table>
  <video class="vidpeek" id="peek" muted playsinline loop crossorigin="anonymous"></video>
  <div class="corner left"><a href="./">back</a></div>

  <script>
    const VIDEO_BASE = 'https://sleebies.github.io/videos/';
    const title = f => f.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ');
    const shortDate = d => { if (!d) return ''; const [y, m, day] = d.split('-'); return +m + '.' + +day + '.' + y.slice(2); };
    const list = document.getElementById('list');
    const peek = document.getElementById('peek');
    const canHover = matchMedia('(hover: hover)').matches;
    const tell = msg => { if (parent !== window) parent.postMessage(msg, '*'); };

    if (!VIDEOS.length) list.outerHTML = '<p class="empty-note">coming soon</p>';
    VIDEOS.forEach(v => {
      const row = list.insertRow();
      row.insertCell().textContent = shortDate(v.date);
      const a = document.createElement('a');
      a.href = 'watch.html?v=' + encodeURIComponent(v.file);
      a.textContent = title(v.file);
      row.insertCell().appendChild(a);
      if (canHover) {
        a.addEventListener('mouseenter', () => preview(a, v.file));
        a.addEventListener('mouseleave', stopPreview);
      }
    });

    // Hover: the home music fades out and the video's sound plays (no picture),
    // muffled the same way the home music is away from home.
    let ctx = null, gain = null, hideTimer = 0;
    function audioOut() {
      if (ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      try {
        ctx = new AC();
        const filter = ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 500;
        filter.Q.value = 0.7;
        gain = ctx.createGain();
        gain.gain.value = 0;
        ctx.createMediaElementSource(peek).connect(gain).connect(filter).connect(ctx.destination);
        return true;
      } catch (e) { ctx = null; return false; }
    }
    function preview(a, file) {
      clearTimeout(hideTimer);
      tell({ sleepyz: 'duck', on: true });
      const src = VIDEO_BASE + encodeURIComponent(file);
      if (peek.dataset.file !== file) { peek.src = src; peek.dataset.file = file; }
      peek.currentTime = 0;
      const sound = audioOut();
      if (ctx && ctx.state === 'suspended') ctx.resume();
      peek.muted = !sound;
      if (gain) gain.gain.setTargetAtTime(1, ctx.currentTime, 0.5);   // its sound creeps in
      peek.play().catch(() => { peek.muted = true; peek.play().catch(() => {}); });
    }
    function stopPreview() {
      tell({ sleepyz: 'duck', on: false });
      if (gain) gain.gain.setTargetAtTime(0, ctx.currentTime, 0.15);
      hideTimer = setTimeout(() => peek.pause(), 400);
    }
  </script>
</body>
</html>
